<!DOCTYPE html>
<html>

<head>
    <title>LiMBS Line Notation Generator</title>

    <style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
        line-height: 1.5;
    }

    h1, h2, h3 {
        color: #222222;
    }

    .section {
        margin-bottom: 25px;
    }

    .input-row {
        margin-bottom: 10px;
    }

    input, select {
        padding: 5px;
        margin: 3px;
    }

    table {
        border-collapse: collapse;
        margin-top: 10px;
        margin-bottom: 20px;
        width: 70%;
    }

    th {
        background-color: #f2f2f2;
    }

    th, td {
        border: 1px solid #cccccc;
        padding: 8px;
        text-align: center;
    }

    td:first-child {
        text-align: left;
        font-weight: bold;
    }

    .submit-button {
        padding: 8px 14px;
        font-size: 15px;
        cursor: pointer;
    }
    </style>
</head>

<body>

<h1>LiMBS Line Notation Generator</h1>

<form action="/generate" method="post">

<div class="section">
    <h3>1. System Type</h3>
    <select name="type">
        <option value="planar" selected>Planar Membrane</option>
        <option value="vesicle">Vesicle</option>
    </select>
</div>

<div class="section">
    <h3>2. Box Dimensions (nm)</h3>

    <div class="input-row">
        X:
        <input type="number" step="0.1" name="box_x" value="42">

        Y:
        <input type="number" step="0.1" name="box_y" value="42">

        Z:
        <input type="number" step="0.1" name="box_z" value="15">
    </div>
</div>

<div class="section">
    <h3>3. Lipid Composition</h3>

    <table>
        <tr>
            <th>Lipid</th>
            <th>Upper Leaflet</th>
            <th>Lower Leaflet</th>
        </tr>

        {% for lipid in lipids %}
        <tr>
            <td>{{ lipid }}</td>
            <td>
                <input type="number" step="1" min="0" name="{{ lipid }}_upper" value="0">
            </td>
            <td>
                <input type="number" step="1" min="0" name="{{ lipid }}_lower" value="0">
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

<div class="section">
    <h3>4. Protein Optional</h3>
    <input type="text" name="protein" placeholder="e.g. claudin-15">
</div>

<div class="section">
    <h3>5. Solvent</h3>
    <select name="sol">
        <option value="W" selected>W</option>
    </select>
</div>

<div class="section">
    <h3>6. Salt</h3>

    Concentration:
    <input type="number" step="0.01" name="salt_conc" value="0.15">

    <select name="salt_ion">
        <option value="NaCl">NaCl</option>
    </select>
</div>

<div class="section">
    <h3>7. Randomization</h3>

    Rand:
    <input type="number" step="0.01" name="rand" value="0.1">

    Solr:
    <input type="number" step="0.01" name="solr" value="0.5">
</div>

<input class="submit-button" type="submit" value="Generate LiMBS Notation">

</form>

</body>

</html>
